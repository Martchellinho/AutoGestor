<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Serviço - AutoGestor</title>

  <link rel="stylesheet"
        th:href="@{/css/style.css}">
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main">

  <div class="header">

    <h1 th:text="${servico.id == null ? 'Novo Serviço' : 'Editar Serviço'}">
      Serviço
    </h1>

    <p>
      Preencha os dados do serviço.
    </p>

  </div>

  <div class="form-container">

    <form th:action="@{/servicos/salvar}"
          th:object="${servico}"
          method="post">

      <input type="hidden"
             th:field="*{id}">

      <label>Descrição</label>

      <input type="text"
             th:field="*{descricao}"
             placeholder="Ex: Pintura do para-choque"
             required>

      <label>Valor</label>

      <input type="number"
             step="0.01"
             min="0"
             th:field="*{valor}"
             placeholder="Ex: 350.00"
             required>

      <br><br>

      <button class="btn"
              type="submit">
        Salvar Serviço
      </button>

      <a class="btn-voltar"
         th:href="@{/servicos}">
        Cancelar
      </a>

    </form>

  </div>

</div>

</body>
</html>
